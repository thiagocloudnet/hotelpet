      <!-- Área principal -->

        <!-- Cabeçalho -->
        <header class="topbar">
          <a href="perfil.html" class="topbar__user" aria-current="page">
            <img
              src="imagens/avatar-gerente.jpeg"
              alt="Foto de Thiago Ferreira Prates Neves"
            />

          </a>

        <!-- Conteúdo da página -->
        <main class="page-content">
          <!-- Caminho de navegação até a página atual. -->
          <div class="breadcrumb">
            <a href="painel.html">Início</a> / Meu perfil
          </div>
          <h1 class="page-title">Meu Perfil</h1>

          <!-- Formulário com os campos e a ação de envio desta tela. -->
          <form action="perfil.html" method="post" class="card">
            <h2>Informações pessoais</h2>
            <!-- Apresentação dos dados detalhados do perfil. -->
            <div class="profile-layout">
              <img
                src="imagens/avatar-gerente.jpeg"
                alt="Foto de Thiago Ferreira Prates Neves"
                class="avatar--large"
              />
            </div>
            <div class="form-grid">
              <div class="form-field">
                <label for="nome">Nome completo</label>
                <input
                  type="text"
                  id="nome"
                  name="nome"
                  value="Thiago Ferreira Prates Neves"
                />
              </div>
              <div class="form-field">
                <label for="nome-exibicao">Nome de exibição</label>
                <input
                  type="text"
                  id="nome-exibicao"
                  name="nome-exibicao"
                  maxlength="40"
                  placeholder="Ex.: Thiago Prates"
                  autocomplete="nickname"
                />
                <small
                  >Nome curto usado nas listas. Se ficar vazio, usamos o
                  primeiro e o último nome.</small
                >
              </div>
              <div class="form-field">
                <label for="email">E-mail</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  value="thiagoprates@hotelpet.shop"
                />
              </div>
              <div class="form-field">
                <label for="telefone">Telefone com DDD</label>
                <input
                  type="tel"
                  id="telefone"
                  name="telefone"
                  value="(77) 99903-0777"
                />
              </div>
              <div class="form-field">
                <label for="funcao">Função</label>
                <input
                  type="text"
                  id="funcao"
                  name="funcao"
                  value="Gerente"
                  disabled
                />
              </div>
              <div class="form-field form-field--full">
                <label for="foto">Foto do perfil</label>
                <input type="file" id="foto" name="foto" accept="image/*" />
              </div>
            </div>

            <!-- Ações disponíveis para os registros ou para a página. -->
            <div class="page-actions">
              <button type="submit" class="button button--primary">
                Salvar alterações
              </button>
              <a href="painel.html" class="button button--secondary"
                >Cancelar</a
              >
            </div>
          </form>
