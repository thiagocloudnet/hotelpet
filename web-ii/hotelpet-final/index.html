<!-- Entrada do Hotel Pet Shop: formulário demonstrativo de acesso, sem backend. -->
<html lang="pt-BR">
<head>
  <!-- Entrar na demonstração acadêmica do Hotel Pet na visão do gerente. -->
  <meta charset="UTF-8">
  <meta name="description" content="Entrar na demonstração acadêmica do Hotel Pet na visão do gerente. Projeto de Thiago Ferreira Prates Neves — ADS/UESB.">
  <meta name="author" content="Thiago Ferreira Prates Neves">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso demonstrativo ao sistema Hotel Pet Shop.">
  <title>Hotel Pet · Entrar · Thiago Prates</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/login-demo.js" defer></script>
</head>
<body data-stage="3" class="login-page">
  <!-- Cartão central que reúne a marca, o perfil demonstrativo e os campos de acesso. -->
  <main class="login-card login-card--personalizado">
    <!-- Identidade visual local: logo e foto não dependem de conexão externa. -->
    <div class="login-brand-line"><img src="imagens/logo.svg" alt=""><span>Hotel Pet Shop</span></div>
    <h1>Acesse o Hotel Pet Shop</h1>
    <p class="login-card__subtitle">Acesso de demonstração ao sistema.</p>

    <!-- Formulário local: o JavaScript de demonstração abre o painel sem enviar a senha. -->
    <form id="login-form" method="post" novalidate>
      <div class="form-field">
        <label for="usuario">Usuário</label>
        <input type="email" id="usuario" name="usuario" value="thiagoprates@hotelpet.shop" autocomplete="username" required>
      </div>
      <div class="form-field">
        <label for="senha">Senha</label>
        <div class="password-control"><input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" aria-describedby="senha-aviso" required><button type="button" class="password-toggle" id="alternar-senha" aria-controls="senha" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></div>
      </div>
      <p class="login-feedback" id="login-feedback" role="status" aria-live="polite"></p>
      <button type="submit" class="button button--primary button--login">Entrar</button>
    </form>

    <!-- Aviso transparente sobre os limites de autenticação deste protótipo acadêmico. -->
    <p class="login-disclaimer" id="senha-aviso">Acesso demonstrativo público: thiagoprates@hotelpet.shop · Senha de exemplo: barao17@. Validação local, sem autenticação real.</p>
  </main>
</body>
</html>
